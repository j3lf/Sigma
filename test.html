<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sigma Jello - Tests</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, sans-serif;

            background: black;
            color: white;

        }


        /* =========================
           BACKGROUND
        ========================= */

        .background {

            position: fixed;

            inset: 0;

            background:
                url("assets/backroundjello.png")
                center / cover
                no-repeat;

            z-index: 0;

        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .container {

            position: relative;

            z-index: 1;

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 25px;

        }


        .title {

            font-size: 52px;

            font-weight: bold;

            margin-bottom: 20px;

            text-shadow:
                0 0 15px rgba(255,255,255,0.35);

        }


        /* =========================
           TEST BUTTONS
        ========================= */

        .test-button {

            width: 260px;
            height: 65px;

            border: none;

            border-radius: 15px;

            background: white;

            color: black;

            font-size: 22px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }


        .test-button:hover {

            transform: scale(1.06);

            box-shadow:
                0 0 25px
                rgba(255,255,255,0.45);

        }


        .test-button:active {

            transform: scale(0.98);

        }


        /* =========================
           BACK BUTTON
        ========================= */

        #sigmaBackButton {

            position: fixed;

            left: 20px;
            bottom: 20px;

            width: 65px;
            height: 65px;

            padding: 0;

            border: none;

            border-radius: 50%;

            background: white;
            color: black;

            font-size: 28px;
            font-weight: bold;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            overflow: hidden;

            white-space: nowrap;

            z-index: 9999;

            transition:
                width 0.25s ease,
                transform 0.2s ease,
                background 0.2s ease,
                border-radius 0.25s ease;

        }


        #sigmaBackButton:hover {

            width: 115px;

            border-radius: 35px;

            transform: scale(1.03);

        }


        .back-arrow {

            flex-shrink: 0;

        }


        .back-text {

            max-width: 0;

            opacity: 0;

            overflow: hidden;

            margin-left: 0;

            transition:
                max-width 0.25s ease,
                opacity 0.2s ease,
                margin-left 0.25s ease;

        }


        #sigmaBackButton:hover .back-text {

            max-width: 60px;

            opacity: 1;

            margin-left: 8px;

        }


        /* =========================
           MUSIC BUTTON
        ========================= */

        #sigmaMusicButton {

            position: fixed;

            right: 20px;
            bottom: 20px;

            width: 65px;
            height: 65px;

            padding: 0;

            border: none;

            border-radius: 50%;

            background: white;
            color: black;

            font-size: 28px;
            font-weight: bold;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            overflow: hidden;

            white-space: nowrap;

            z-index: 9999;

            transition:
                width 0.25s ease,
                transform 0.2s ease,
                border-radius 0.25s ease;

        }


        #sigmaMusicButton:hover {

            width: 150px;

            border-radius: 35px;

            transform: scale(1.03);

        }


        .music-icon {

            flex-shrink: 0;

        }


        .music-text {

            max-width: 0;

            opacity: 0;

            overflow: hidden;

            margin-left: 0;

            transition:
                max-width 0.25s ease,
                opacity 0.2s ease,
                margin-left 0.25s ease;

        }


        #sigmaMusicButton:hover .music-text {

            max-width: 100px;

            opacity: 1;

            margin-left: 8px;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .title {

                font-size: 40px;

            }


            .test-button {

                width: 220px;

            }

        }

    </style>

</head>


<body>


<div
    id="background"
    class="background">
</div>


<div class="container">

    <div class="title">
        Tests
    </div>


    <button
        class="test-button"
        onclick="openTest('https://book.sundby.com/')">

        Test 1

    </button>


    <button
        class="test-button"
        onclick="openTest('https://superfunmath.study/')">

        Test 2

    </button>


    <button
        class="test-button"
        onclick="openTest('https://boat.strongson.com/')">

        Test 3

    </button>

</div>


<!-- SIGMA JELLO BACK BUTTON -->

<button
    id="sigmaBackButton"
    type="button"
    onclick="goBackToSigma()">

    <span class="back-arrow">
        ←
    </span>

    <span class="back-text">
        Back
    </span>

</button>


<!-- SIGMA JELLO MUSIC BUTTON -->

<button
    id="sigmaMusicButton"
    type="button"
    onclick="openJelloMusic()">

    <span class="music-icon">
        ♫
    </span>

    <span class="music-text">
        Jello Music
    </span>

</button>


<script>

    /* =========================
       OPEN TEST IN ABOUT:BLANK
    ========================= */

    function openTest(url) {

        const newTab =
            window.open(
                "about:blank",
                "_blank"
            );


        if (!newTab) {

            alert(
                "Please allow pop-ups for Sigma Jello."
            );

            return;

        }


        newTab.document.open();


        newTab.document.write(`

            <!DOCTYPE html>

            <html>

            <head>

                <title>about:blank</title>

                <style>

                    html,
                    body {

                        margin: 0;
                        padding: 0;

                        width: 100%;
                        height: 100%;

                        overflow: hidden;

                        background: black;

                    }


                    iframe {

                        width: 100%;
                        height: 100%;

                        border: none;

                        display: block;

                    }

                </style>

            </head>


            <body>

                <iframe
                    src="${url}"
                    allowfullscreen>
                </iframe>

            </body>

            </html>

        `);


        newTab.document.close();

    }


    /* =========================
       BACK TO SIGMA JELLO
    ========================= */

    function goBackToSigma() {

        window.location.href = "index.html";

    }


    /* =========================
       JELLO MUSIC
    ========================= */

    function openJelloMusic() {

        window.open(
            "music.html",
            "_blank"
        );

    }

</script>


</body>

</html>
```
