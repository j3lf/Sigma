<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>

    <script>
        function launch() {

            /*
             * =========================
             * LOAD SIGMA JELLO SETTINGS
             * =========================
             */

            const DEFAULT_TAB_NAME = "about:blank";
            const DEFAULT_TAB_ICON = "assets/icons/sigma.jpg";

            const savedTabName =
                localStorage.getItem("jelloTabName")
                || DEFAULT_TAB_NAME;

            const savedTabIcon =
                localStorage.getItem("jelloTabIcon")
                || DEFAULT_TAB_ICON;


            /*
             * =========================
             * OPEN ABOUT:BLANK TAB
             * =========================
             */

            const newWindow =
                window.open(
                    "about:blank",
                    "_blank"
                );


            /*
             * Check if popup was blocked
             */

            if (!newWindow) {

                document.body.innerHTML =
                    "<h2>Please allow pop-ups for this site.</h2>";

                return;
            }


            /*
             * =========================
             * APPLY TAB SETTINGS
             * =========================
             */

            newWindow.document.open();

            newWindow.document.write(`
                <!DOCTYPE html>

                <html>

                <head>

                    <title>
                        ${escapeHTML(savedTabName)}
                    </title>

                    <link
                        id="jelloFavicon"
                        rel="icon"
                        href="${escapeHTML(savedTabIcon)}"
                    >

                    <style>

                        html,
                        body {

                            margin: 0;
                            padding: 0;

                            width: 100%;
                            height: 100%;

                            overflow: hidden;

                            background: black;

                        }


                        iframe {

                            width: 100%;
                            height: 100%;

                            border: none;

                            display: block;

                        }

                    </style>

                </head>


                <body>

                    <iframe
                        src="${new URL(
                            "index.html",
                            window.location.href
                        ).href}"
                        allowfullscreen>
                    </iframe>

                </body>

                </html>
            `);

            newWindow.document.close();


            /*
             * =========================
             * NO TAB CLOSE
             * =========================
             *
             * Uses the exact same setting
             * as settings.html.
             */

            if (
                localStorage.getItem("noTabClose")
                === "true"
            ) {

                newWindow.onbeforeunload =
                    function(event) {

                        event.preventDefault();

                        event.returnValue = "";

                        return "";

                    };

            }


            /*
             * =========================
             * SEND LAUNCHER TO GOOGLE
             * =========================
             */

            window.location.href =
                "https://www.google.com";
        }


        /*
         * =========================
         * HTML ESCAPE
         * =========================
         *
         * Prevents a custom tab name/icon
         * from breaking the generated page.
         */

        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /*
         * =========================
         * LAUNCH AUTOMATICALLY
         * =========================
         */

        window.onload = launch;

    </script>
</head>


<body>

    <h2>
        Launching Sigma Jello...
    </h2>

</body>
</html>
