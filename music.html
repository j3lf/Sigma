<!DOCTYPE html>
<html>
<head>
    <title>Jello Music</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .background {
            position: fixed;
            inset: -40px;
            background:
                url("assets/backroundjello.png")
                center center / cover no-repeat;
            z-index: 0;
            transform: translate(0px, 0px);
            transition: transform 0.15s ease-out;
            pointer-events: none;
        }

        .music-container {
            position: relative;
            z-index: 1;
            width: 900px;
            max-width: calc(100% - 30px);
            margin: 0 auto;
            padding: 55px 0 120px;
        }

        .title {
            font-size: 58px;
            font-weight: 500;
            letter-spacing: -3px;
            margin: 0 0 30px;
            text-align: center;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.65);
        }

        .player {
            background: rgba(255, 255, 255, 0.96);
            color: black;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);
            margin-bottom: 18px;
        }

        .now-playing-label {
            text-align: center;
            color: #777;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .now-playing {
            text-align: center;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 20px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-info {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 10px;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .progress {
            width: 100%;
            height: 7px;
            appearance: none;
            -webkit-appearance: none;
            background: #ddd;
            border-radius: 10px;
            cursor: pointer;
        }

        .progress::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #111;
            border-radius: 50%;
            cursor: pointer;
        }

        .progress::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #111;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 22px;
        }

        .control-button {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: #eee;
            color: black;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .control-button:hover {
            background: #ddd;
            transform: scale(1.08);
        }

        .play-button {
            width: 62px;
            height: 62px;
            background: #111;
            color: white;
            font-size: 23px;
        }

        .play-button:hover {
            background: #333;
        }

        .active {
            background: #111 !important;
            color: white !important;
        }

        .repeat-one {
            position: relative;
        }

        .repeat-one::after {
            content: "1";
            position: absolute;
            right: 7px;
            bottom: 5px;
            font-size: 10px;
            font-weight: bold;
        }

        .volume-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .volume-container span {
            font-size: 18px;
        }

        .volume {
            width: 150px;
        }

        /* =========================
           LIBRARY
           ========================= */

        .library-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 18px 0 10px;
            color: white;
        }

        .library-title {
            font-size: 20px;
            font-weight: bold;
        }

        .library-header-left {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .import-help {
            color: #bbb;
            font-size: 11px;
        }

        .library-header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .song-count {
            font-size: 13px;
            color: #ccc;
        }

        .import-button {
            border: none;
            border-radius: 7px;
            padding: 9px 13px;
            background: white;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .import-button:hover {
            background: #ddd;
            transform: translateY(-1px);
        }

        .imported-badge {
            display: inline-block;
            margin-left: 8px;
            padding: 3px 6px;
            border-radius: 4px;
            background: #ddd;
            color: #555;
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 0.5px;
            vertical-align: middle;
        }

        .song.playing .imported-badge {
            background: #333;
            color: #ccc;
        }

        .remove-imported-button {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: #777;
            font-size: 17px;
            cursor: pointer;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .remove-imported-button:hover {
            background: rgba(0, 0, 0, 0.08);
            color: #b00000;
        }

        .song.playing .remove-imported-button {
            color: #aaa;
        }

        .song.playing .remove-imported-button:hover {
            color: white;
            background: rgba(255, 255, 255, 0.12);
        }

        .search {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 10px;
            border: none;
            outline: none;
            border-radius: 8px;
            background: white;
            color: black;
            font-size: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .filter-button {
            border: none;
            border-radius: 7px;
            padding: 9px 14px;
            background: rgba(255, 255, 255, 0.9);
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .filter-button:hover {
            background: white;
            transform: translateY(-1px);
        }

        .filter-button.active {
            background: #111;
            color: white;
        }

        /* =========================
           PLAYLISTS
           ========================= */

        .playlist-section {
            margin-bottom: 18px;
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            margin-bottom: 10px;
        }

        .playlist-title {
            font-size: 20px;
            font-weight: bold;
        }

        .create-playlist-button {
            border: none;
            border-radius: 7px;
            padding: 9px 14px;
            background: white;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .create-playlist-button:hover {
            background: #ddd;
            transform: translateY(-1px);
        }

        .playlist-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .playlist-button {
            display: flex;
            align-items: center;
            gap: 7px;
            border: none;
            border-radius: 7px;
            padding: 10px 13px;
            background: rgba(255, 255, 255, 0.9);
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .playlist-button:hover {
            background: white;
            transform: translateY(-1px);
        }

        .playlist-button.active {
            background: #111;
            color: white;
        }

        .playlist-song-count {
            font-size: 11px;
            opacity: 0.65;
        }

        .playlist-actions {
            display: none;
            gap: 3px;
        }

        .playlist-button:hover .playlist-actions {
            display: flex;
        }

        .playlist-action {
            border: none;
            background: transparent;
            color: inherit;
            cursor: pointer;
            font-size: 13px;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .playlist-action:hover {
            background: rgba(128, 128, 128, 0.25);
        }

        .playlist-view {
            background: rgba(255, 255, 255, 0.96);
            color: black;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
        }

        .playlist-view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .playlist-view-name {
            font-size: 21px;
            font-weight: bold;
        }

        .playlist-view-buttons {
            display: flex;
            gap: 6px;
        }

        .playlist-small-button {
            border: none;
            border-radius: 6px;
            padding: 8px 11px;
            background: #eee;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        .playlist-small-button:hover {
            background: #ddd;
        }

        .playlist-song {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 7px;
            gap: 8px;
        }

        .playlist-song:hover {
            background: #eee;
        }

        .playlist-song-name {
            flex: 1;
            font-size: 14px;
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .playlist-song-remove {
            border: none;
            background: transparent;
            color: #888;
            cursor: pointer;
            font-size: 16px;
            border-radius: 50%;
            width: 30px;
            height: 30px;
        }

        .playlist-song-remove:hover {
            background: #ddd;
            color: black;
        }

        .empty-playlist {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 14px;
        }

        .playlist-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .playlist-modal.show {
            display: flex;
        }

        .playlist-modal-box {
            width: 400px;
            max-width: calc(100% - 30px);
            background: white;
            color: black;
            border-radius: 9px;
            padding: 22px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            animation: clickguiOpen 0.2s ease-out;
        }

        .playlist-modal-box h2 {
            margin: 0 0 15px;
        }

        .playlist-modal-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 15px;
        }

        .playlist-modal-input:focus {
            border-color: #111;
        }

        .playlist-modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 15px;
        }

        .modal-button {
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-cancel {
            background: #eee;
            color: black;
        }

        .modal-confirm {
            background: #111;
            color: white;
        }

        .modal-confirm:hover {
            background: #333;
        }

        .add-song-modal-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 12px;
        }

        .add-song-option {
            width: 100%;
            text-align: left;
            border: none;
            background: #f2f2f2;
            color: black;
            padding: 11px;
            margin-bottom: 6px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-song-option:hover {
            background: #ddd;
        }

        .add-song-option.added {
            background: #111;
            color: white;
        }

        /* =========================
           SONG LIST
           ========================= */

        .song-list {
            background: rgba(255, 255, 255, 0.96);
            color: black;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.65);
        }

        .song {
            display: flex;
            align-items: center;
            padding: 13px 12px;
            border-radius: 7px;
            cursor: pointer;
            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .song:hover {
            background: #eee;
            transform: translateX(3px);
        }

        .song.playing {
            background: #111;
            color: white;
        }

        .song-number {
            width: 38px;
            color: #888;
            font-size: 13px;
            flex-shrink: 0;
        }

        .song.playing .song-number {
            color: #aaa;
        }

        .song-name {
            flex: 1;
            font-size: 15px;
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .song-actions {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .favorite-button,
        .add-playlist-button {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: #777;
            font-size: 19px;
            cursor: pointer;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .favorite-button:hover,
        .add-playlist-button:hover {
            background: rgba(0, 0, 0, 0.08);
            color: black;
        }

        .song.playing .favorite-button,
        .song.playing .add-playlist-button {
            color: #aaa;
        }

        .favorite-button.favorite {
            color: black;
        }

        .song.playing .favorite-button.favorite {
            color: white;
        }

        .empty-library {
            text-align: center;
            padding: 35px 15px;
            color: #777;
            font-size: 15px;
        }

        /* =========================
           BACK BUTTON
           ========================= */

        .back-button {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 65px;
            height: 65px;
            padding: 0;
            border-radius: 50%;
            border: none;
            background: white;
            color: black;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;
            transition:
                width 0.25s ease,
                transform 0.2s ease,
                background 0.2s ease,
                border-radius 0.25s ease;
            z-index: 10;
        }

        .back-button:hover {
            width: 115px;
            background: #ddd;
            transform: scale(1.08);
            border-radius: 35px;
        }

        .back-button .back-letter {
            display: block;
        }

        .back-button .back-text {
            display: none;
            font-size: 18px;
        }

        .back-button:hover .back-letter {
            display: none;
        }

        .back-button:hover .back-text {
            display: block;
        }

        /* =========================
           QUICK SETTINGS
           ========================= */

        .quick-settings {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .quick-settings.show {
            display: flex;
        }

        .quick-settings-box {
            width: 360px;
            max-width: calc(100% - 30px);
            background: white;
            color: black;
            border-radius: 7px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.65);
            animation: clickguiOpen 0.2s ease-out;
        }

        .quick-settings-box h2 {
            margin: 0 0 22px;
            font-size: 25px;
        }

        .quick-setting {
            background: #f2f2f2;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .quick-setting:hover {
            background: #e7e7e7;
            transform: translateX(3px);
        }

        .quick-setting span {
            font-size: 16px;
            font-weight: bold;
        }

        .switch {
            position: relative;
            width: 48px;
            height: 25px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #cfcfcf;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .slider:before {
            content: "";
            position: absolute;
            width: 19px;
            height: 19px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }

        input:checked + .slider {
            background: #111;
        }

        input:checked + .slider:before {
            transform: translateX(23px);
        }

        @keyframes clickguiOpen {
            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 700px) {

            .music-container {
                width: calc(100% - 20px);
                padding-top: 30px;
            }

            .title {
                font-size: 45px;
            }

            .player {
                padding: 18px;
            }

            .controls {
                gap: 7px;
            }

            .control-button {
                width: 43px;
                height: 43px;
            }

            .play-button {
                width: 55px;
                height: 55px;
            }

            .back-button {
                width: 55px;
                height: 55px;
                bottom: 12px;
                left: 12px;
            }

            .back-button:hover {
                width: 105px;
            }

            .playlist-view-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .playlist-button {
                max-width: 100%;
            }

            .playlist-actions {
                display: flex;
            }

            .song-actions {
                gap: 0;
            }

            .song-number {
                width: 28px;
            }

            .library-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .library-header-right {
                width: 100%;
                justify-content: space-between;
            }

            .import-button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

    <div id="background" class="background"></div>

    <div class="music-container">

        <h1 class="title">Jello Music</h1>

        <!-- PLAYER -->

        <div class="player">

            <div class="now-playing-label">
                Now Playing
            </div>

            <div id="nowPlaying" class="now-playing">
                Select a song
            </div>

            <div class="time-row">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <input
                id="progress"
                class="progress"
                type="range"
                min="0"
                max="100"
                value="0"
            >

            <div class="controls">

                <button
                    id="shuffleButton"
                    class="control-button"
                    title="Shuffle"
                >🔀</button>

                <button
                    id="previousButton"
                    class="control-button"
                    title="Previous"
                >⏮</button>

                <button
                    id="playButton"
                    class="control-button play-button"
                    title="Play"
                >▶</button>

                <button
                    id="nextButton"
                    class="control-button"
                    title="Next"
                >⏭</button>

                <button
                    id="repeatButton"
                    class="control-button"
                    title="Repeat"
                >🔁</button>

            </div>

            <div class="volume-container">
                <span>🔊</span>

                <input
                    id="volume"
                    class="volume"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                >
            </div>

            <div id="playerInfo" class="player-info">
                0 songs
            </div>

        </div>

        <!-- PLAYLISTS -->

        <div class="playlist-section">

            <div class="playlist-header">

                <span class="playlist-title">
                    Playlists
                </span>

                <button
                    id="createPlaylistButton"
                    class="create-playlist-button"
                >
                    + Create Playlist
                </button>

            </div>

            <div
                id="playlistList"
                class="playlist-list"
            ></div>

        </div>

        <!-- ACTIVE PLAYLIST -->

        <div
            id="playlistView"
            class="playlist-view"
            style="display: none;"
        ></div>

        <!-- LIBRARY -->

        <div class="library-header">

            <div class="library-header-left">

                <span class="library-title">
                    Library
                </span>

                <span class="import-help">
                    Import your own MP3 files
                </span>

            </div>

            <div class="library-header-right">

                <span
                    id="songCount"
                    class="song-count"
                >
                    0 songs
                </span>

                <button
                    id="importButton"
                    class="import-button"
                    type="button"
                >
                    + Import MP3
                </button>

                <input
                    id="mp3FileInput"
                    type="file"
                    accept=".mp3,audio/mpeg"
                    multiple
                    style="display: none;"
                >

            </div>

        </div>

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Search songs..."
            autocomplete="off"
        >

        <div class="filters">

            <button
                id="allFilter"
                class="filter-button active"
            >
                All Songs
            </button>

            <button
                id="favoriteFilter"
                class="filter-button"
            >
                ★ Favorites
            </button>

            <button
                id="recentFilter"
                class="filter-button"
            >
                Recently Played
            </button>

        </div>

        <div id="songList" class="song-list"></div>

    </div>

    <audio
        id="audio"
        preload="metadata"
    ></audio>

    <!-- BACK -->

    <button
        class="back-button"
        onclick="goBackToSigma()"
    >
        <span class="back-letter">←</span>
        <span class="back-text">Back</span>
    </button>

    <!-- CREATE / RENAME PLAYLIST MODAL -->

    <div
        id="playlistNameModal"
        class="playlist-modal"
    >

        <div class="playlist-modal-box">

            <h2 id="playlistNameModalTitle">
                Create Playlist
            </h2>

            <input
                id="playlistNameInput"
                class="playlist-modal-input"

        const importedSongURLs = {};

        const importedSongKeys = new Set();

        const IMPORTED_DB_NAME =
            "JelloMusicDatabase";

        const IMPORTED_DB_VERSION = 1;

        const IMPORTED_STORE_NAME =
            "mp3Files";

        let importedDB = null;

        function openImportedDatabase() {

            return new Promise(
                function(resolve, reject) {

                    if (importedDB) {
                        resolve(importedDB);
                        return;
                    }

                    if (!window.indexedDB) {

                        reject(
                            new Error(
                                "IndexedDB is not supported by this browser."
                            )
                        );

                        return;
                    }

                    const request =
                        indexedDB.open(
                            IMPORTED_DB_NAME,
                            IMPORTED_DB_VERSION
                        );

                    request.onupgradeneeded =
                        function(event) {

                            const db =
                                event.target.result;

                            if (
                                !db.objectStoreNames.contains(
                                    IMPORTED_STORE_NAME
                                )
                            ) {

                                db.createObjectStore(
                                    IMPORTED_STORE_NAME,
                                    {
                                        keyPath: "id"
                                    }
                                );

                            }

                        };

                    request.onsuccess =
                        function(event) {

                            importedDB =
                                event.target.result;

                            resolve(importedDB);

                        };

                    request.onerror =
                        function() {

                            reject(
                                request.error
                            );

                        };

                }
            );
        }

        function saveImportedMP3(
            id,
            name,
            blob
        ) {

            return openImportedDatabase()
                .then(
                    function(db) {

                        return new Promise(
                            function(resolve, reject) {

                                const transaction =
                                    db.transaction(
                                        IMPORTED_STORE_NAME,
                                        "readwrite"
                                    );

                                const store =
                                    transaction.objectStore(
                                        IMPORTED_STORE_NAME
                                    );

                                store.put({
                                    id: id,
                                    name: name,
                                    blob: blob
                                });

                                transaction.oncomplete =
                                    function() {
                                        resolve();
                                    };

                                transaction.onerror =
                                    function() {
                                        reject(
                                            transaction.error
                                        );
                                    };

                            }
                        );

                    }
                );
        }

        function loadImportedMP3s() {

            return openImportedDatabase()
                .then(
                    function(db) {

                        return new Promise(
                            function(resolve, reject) {

                                const transaction =
                                    db.transaction(
                                        IMPORTED_STORE_NAME,
                                        "readonly"
                                    );

                                const store =
                                    transaction.objectStore(
                                        IMPORTED_STORE_NAME
                                    );

                                const request =
                                    store.getAll();

                                request.onsuccess =
                                    function() {

                                        resolve(
                                            request.result || []
                                        );

                                    };

                                request.onerror =
                                    function() {

                                        reject(
                                            request.error
                                        );

                                    };

                            }
                        );

                    }
                );
        }

        function deleteImportedMP3(id) {

            return openImportedDatabase()
                .then(
                    function(db) {

                        return new Promise(
                            function(resolve, reject) {

                                const transaction =
                                    db.transaction(
                                        IMPORTED_STORE_NAME,
                                        "readwrite"
                                    );

                                const store =
                                    transaction.objectStore(
                                        IMPORTED_STORE_NAME
                                    );

                                store.delete(id);

                                transaction.oncomplete =
                                    function() {
                                        resolve();
                                    };

                                transaction.onerror =
                                    function() {
                                        reject(
                                            transaction.error
                                        );
                                    };

                            }
                        );

                    }
                );
        }

        function createImportedSongID(
            name
        ) {

            let id =
                "imported:" + name;

            let number = 2;

            while (
                importedSongKeys.has(id) ||
                songs.includes(name)
            ) {

                id =
                    "imported:" +
                    name +
                    " (" +
                    number +
                    ")";

                number++;

            }

            return id;
        }

        async function importMP3Files(files) {

            const mp3Files =
                files.filter(
                    function(file) {

                        return (
                            file.type === "audio/mpeg" ||
                            /\.mp3$/i.test(file.name)
                        );

                    }
                );

            if (
                mp3Files.length === 0
            ) {

                alert(
                    "Please select MP3 files."
                );

                return;
            }

            let importedCount = 0;

            for (
                const file of mp3Files
            ) {

                try {

                    const id =
                        createImportedSongID(
                            file.name
                        );

                    await saveImportedMP3(
                        id,
                        file.name,
                        file
                    );

                    const objectURL =
                        URL.createObjectURL(
                            file
                        );

                    importedSongURLs[id] =
                        objectURL;

                    importedSongKeys.add(id);

                    songs.push(id);

                    importedCount++;

                } catch (error) {

                    console.error(
                        "Could not import:",
                        file.name,
                        error
                    );

                }

            }

            renderPlaylists();
            renderPlaylistView();
            renderSongs();

            if (
                importedCount === 1
            ) {

                nowPlaying.textContent =
                    "Imported 1 MP3";

            } else if (
                importedCount > 1
            ) {

                nowPlaying.textContent =
                    "Imported " +
                    importedCount +
                    " MP3s";

            }

        }

        }

        async function removeImportedSong(
            index
        ) {

            const song =
                songs[index];

            if (
                !importedSongKeys.has(song)
            ) {

                return;
            }

            const confirmed =
                confirm(
                    'Remove "' +
                    getSongDisplayName(song) +
                    '" from your imported music?'
                );

            if (!confirmed) {
                return;
            }

            if (
                currentIndex === index
            ) {

                audio.pause();
                audio.removeAttribute("src");
                audio.load();

                currentIndex = -1;

                nowPlaying.textContent =
                    "Select a song";

                currentTime.textContent =
                    "0:00";

                duration.textContent =
                    "0:00";

                progress.value = 0;

            } else if (
                currentIndex > index
            ) {

                currentIndex--;

            }

            const objectURL =
                importedSongURLs[song];

            if (objectURL) {

                URL.revokeObjectURL(
                    objectURL
                );

            }

            delete importedSongURLs[song];

            importedSongKeys.delete(song);

            try {

                await deleteImportedMP3(
                    song
                );

            } catch (error) {

                console.error(
                    "Could not delete imported MP3:",
                    error
                );

            }

            songs.splice(
                index,
                1
            );

            favorites =
                favorites.filter(
                    function(item) {
                        return item !== song;
                    }
                );

            recentSongs =
                recentSongs.filter(
                    function(item) {
                        return item !== song;
                    }
                );

            Object.keys(playlists).forEach(
                function(name) {

                    playlists[name] =
                        playlists[name].filter(
                            function(item) {
                                return item !== song;
                            }
                        );

                }
            );

            saveFavorites();
            saveRecent();
            savePlaylists();

            if (playlistPlayback) {

                const playlistSongs =
                    getPlaylistSongs(
                        playlistPlayback.name
                    );

                if (
                    playlistPlayback.index >=
                    playlistSongs.length
                ) {

                    playlistPlayback.index =
                        Math.max(
                            0,
                            playlistSongs.length - 1
                        );

                }

                if (
                    playlistSongs.length === 0
                ) {

                    playlistPlayback = null;

                }

            }

            renderPlaylists();
            renderPlaylistView();
            renderSongs();

        }

        function getSongDisplayName(
            song
        ) {

            if (
                importedSongKeys.has(song)
            ) {

                const parts =
                    song.split(":");

                if (
                    parts.length > 1
                ) {

                    let name =
                        parts
                            .slice(1)
                            .join(":");

                    const match =
                        name.match(
                            /^(.*) \((\d+)\)$/
                        );

                    if (match) {
                        name = match[1];
                    }

                    return name.replace(
                        /\.mp3$/i,
                        ""
                    );
                }
            }

            return song.replace(
                /\.mp3$/i,
                ""
            );

        }

        function formatTime(seconds) {

            if (!Number.isFinite(seconds)) {
                return "0:00";
            }

            const minutes =
                Math.floor(seconds / 60);

            const remaining =
                Math.floor(seconds % 60)
                    .toString()
                    .padStart(2, "0");

            return minutes + ":" + remaining;
        }
