                            ) {

                                playlistPlayback = {
                                    name:
                                        activePlaylist,
                                    index:
                                        index,
                                    shuffle:
                                        false
                                };

                                loadSong(
                                    actualIndex,
                                    true
                                );

                            }

                        }
                    );

                    playlistView.appendChild(row);

                }
            );
        }

        /* =========================
           CREATE PLAYLIST
           ========================= */

        function openCreatePlaylist() {

            playlistModalMode = "create";
            playlistRenameTarget = null;

            playlistNameModalTitle.textContent =
                "Create Playlist";

            playlistNameConfirm.textContent =
                "Create";

            playlistNameInput.value = "";

            playlistNameModal.classList.add(
                "show"
            );

            setTimeout(
                function() {
                    playlistNameInput.focus();
                },
                50
            );
        }

        function openRenamePlaylist(name) {

            playlistModalMode = "rename";
            playlistRenameTarget = name;

            playlistNameModalTitle.textContent =
                "Rename Playlist";

            playlistNameConfirm.textContent =
                "Rename";

            playlistNameInput.value = name;

            playlistNameModal.classList.add(
                "show"
            );

            setTimeout(
                function() {
                    playlistNameInput.focus();
                    playlistNameInput.select();
                },
                50
            );
        }

        function closePlaylistNameModal() {

            playlistNameModal.classList.remove(
                "show"
            );

            playlistNameInput.value = "";

        }

        function confirmPlaylistName() {

            const name =
                playlistNameInput.value.trim();

            if (!name) {
                return;
            }

            if (
                playlistModalMode ===
                "create"
            ) {

                if (playlists[name]) {

                    alert(
                        "A playlist with that name already exists."
                    );

                    return;
                }

                playlists[name] = [];

                savePlaylists();

                activePlaylist = name;

                renderPlaylists();
                renderPlaylistView();

                closePlaylistNameModal();

                return;
            }

            if (
                playlistModalMode ===
                "rename"
            ) {

                if (
                    name !== playlistRenameTarget &&
                    playlists[name]
                ) {

                    alert(
                        "A playlist with that name already exists."
                    );

                    return;
                }

                playlists[name] =
                    playlists[
                        playlistRenameTarget
                    ];

                delete playlists[
                    playlistRenameTarget
                ];

                if (
                    activePlaylist ===
                    playlistRenameTarget
                ) {

                    activePlaylist = name;

                }

                savePlaylists();

                renderPlaylists();
                renderPlaylistView();

                closePlaylistNameModal();

            }
        }

        function deletePlaylist(name) {

            const confirmed =
                confirm(
                    'Delete playlist "' +
                    name +
                    '"?'
                );

            if (!confirmed) {
                return;
            }

            delete playlists[name];

            if (
                activePlaylist === name
            ) {

                activePlaylist = null;
                playlistPlayback = null;

            }

            savePlaylists();

            renderPlaylists();
            renderPlaylistView();

        }

        createPlaylistButton.addEventListener(
            "click",
            openCreatePlaylist
        );

        playlistNameCancel.addEventListener(
            "click",
            closePlaylistNameModal
        );

        playlistNameConfirm.addEventListener(
            "click",
            confirmPlaylistName
        );

        playlistNameInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    confirmPlaylistName();

                }

                if (event.key === "Escape") {

                    closePlaylistNameModal();

                }

            }
        );

        playlistNameModal.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    playlistNameModal
                ) {

                    closePlaylistNameModal();

                }

            }
        );

        /* =========================
           ADD SONG TO PLAYLIST
           ========================= */

        function openAddSongModal(index) {

            if (
                Object.keys(playlists).length ===
                0
            ) {

                openCreatePlaylist();

                return;
            }

            addSongTargetIndex = index;

            addSongModalList.innerHTML = "";

            Object.keys(playlists).forEach(
                function(name) {

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.className =
                        "add-song-option";

                    const alreadyAdded =
                        playlists[name].includes(
                            songs[index]
                        );

                    if (alreadyAdded) {

                        button.classList.add(
                            "added"
                        );

                    }

                    button.textContent =
                        alreadyAdded
                            ? "✓ " + name
                            : "+ " + name;

                    button.addEventListener(
                        "click",
                        function() {

                            const song =
                                songs[
                                    addSongTargetIndex
                                ];

                            if (
                                playlists[name].includes(
                                    song
                                )
                            ) {

                                playlists[name] =
                                    playlists[name].filter(
                                        function(item) {
                                            return item !== song;
                                        }
                                    );

                            } else {

                                playlists[name].push(
                                    song
                                );

                            }

                            savePlaylists();

                            renderPlaylists();
                            renderPlaylistView();

                            openAddSongModal(
                                addSongTargetIndex
                            );

                        }
                    );

                    addSongModalList.appendChild(
                        button
                    );

                }
            );

            addSongModal.classList.add(
                "show"
            );
        }

        function closeAddSongModal() {

            addSongModal.classList.remove(
                "show"
            );

            addSongTargetIndex = null;

        }

        addSongCancel.addEventListener(
            "click",
            closeAddSongModal
        );

        addSongModal.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    addSongModal
                ) {

                    closeAddSongModal();

                }

            }
        );

        /* =========================
           PLAYLIST PLAYBACK
           ========================= */

        function playPlaylist(
            playlistName,
            shuffle
        ) {

            const playlistSongs =
                getPlaylistSongs(
                    playlistName
                );

            if (
                playlistSongs.length === 0
            ) {

                return;
            }

            activePlaylist = playlistName;

            playlistPlayback = {
                name: playlistName,
                index:
                    shuffle
                        ? Math.floor(
                            Math.random() *
                            playlistSongs.length
                        )
                        : 0,
                shuffle: shuffle
            };

            const song =
                playlistSongs[
                    playlistPlayback.index
                ];

            const actualIndex =
                songs.indexOf(song);

            if (
                actualIndex !== -1
            ) {

                loadSong(
                    actualIndex,
                    true
                );

            }

            renderPlaylists();
            renderPlaylistView();

        }

        function playNextPlaylistSong() {

            if (!playlistPlayback) {
                return false;
            }

            const playlistSongs =
                getPlaylistSongs(
                    playlistPlayback.name
                );

            if (
                playlistSongs.length === 0
            ) {

                playlistPlayback = null;

                return false;
            }

            let nextIndex;

            if (
                playlistPlayback.shuffle
            ) {

                if (
                    playlistSongs.length === 1
                ) {

                    nextIndex = 0;

                } else {

                    do {

                        nextIndex =
                            Math.floor(
                                Math.random() *
                                playlistSongs.length
                            );

                    } while (
                        nextIndex ===
                        playlistPlayback.index
                    );

                }

            } else {

                nextIndex =
                    playlistPlayback.index + 1;

                if (
                    nextIndex >=
                    playlistSongs.length
                ) {

                    if (
                        repeatMode === 1
                    ) {

                        nextIndex = 0;

                    } else {

                        playlistPlayback = null;

                        return false;

                    }
                }
            }

            playlistPlayback.index =
                nextIndex;

            const song =
                playlistSongs[nextIndex];

            const actualIndex =
                songs.indexOf(song);

            if (
                actualIndex === -1
            ) {

                return false;
            }

            loadSong(
                actualIndex,
                true
            );

            return true;
        }

        /* =========================
           FILTERING
           ========================= */

        function getFilteredIndexes() {

            const query =
                search.value
                    .trim()
                    .toLowerCase();

            let indexes =
                songs.map(
                    function(song, index) {
                        return index;
                    }
                );

            if (
                currentFilter ===
                "favorites"
            ) {

                indexes =
                    indexes.filter(
                        function(index) {
                            return isFavorite(index);
                        }
                    );
            }

            if (
                currentFilter ===
                "recent"
            ) {

                indexes =
                    recentSongs
                        .map(
                            function(song) {
                                return songs.indexOf(song);
                            }
                        )
                        .filter(
                            function(index) {
                                return index !== -1;
                            }
                        );
            }

            if (query) {

                indexes =
                    indexes.filter(
                        function(index) {

                            return getSongDisplayName(
                                songs[index]
                            )
                                .toLowerCase()
                                .includes(query);

                        }
                    );
            }

            return indexes;
        }

        /* =========================
           RENDER SONGS
           ========================= */

        function renderSongs() {

            songList.innerHTML = "";

            const indexes =
                getFilteredIndexes();

            songCount.textContent =
                indexes.length +
                (
                    indexes.length === 1
                        ? " song"
                        : " songs"
                );

            playerInfo.textContent =
                songs.length +
                (
                    songs.length === 1
                        ? " song in library"
                        : " songs in library"
                );

            if (
                indexes.length === 0
            ) {

                const empty =
                    document.createElement("div");

                empty.className =
                    "empty-library";

                if (
                    currentFilter ===
                    "favorites"
                ) {

                    empty.textContent =
                        "No favorite songs yet.";

                } else if (
                    currentFilter ===
                    "recent"
                ) {

                    empty.textContent =
                        "No recently played songs yet.";

                } else {

                    empty.textContent =
                        "No songs found.";

                }

                songList.appendChild(empty);

                return;
            }

            indexes.forEach(
                function(index) {

                    const song =
                        songs[index];

                    const item =
                        document.createElement("div");

                    item.className = "song";

                    if (
                        index === currentIndex
                    ) {

                        item.classList.add(
                            "playing"
                        );

                    }

                    const number =
                        document.createElement("div");

                    number.className =
                        "song-number";

                    number.textContent =
                        index + 1;

                    const name =
                        document.createElement("div");

                    name.className =
                        "song-name";

                    name.textContent =
                        getSongDisplayName(song);

                    if (
                        importedSongKeys.has(song)
                    ) {

                        const badge =
                            document.createElement("span");

                        badge.className =
                            "imported-badge";

                        badge.textContent =
                            "IMPORTED";

                        name.appendChild(
                            badge
                        );

                    }

                    const actions =
                        document.createElement("div");

                    actions.className =
                        "song-actions";

                    if (
                        importedSongKeys.has(song)
                    ) {

                        const removeImported =
                            document.createElement("button");

                        removeImported.className =
                            "remove-imported-button";

                        removeImported.type =
                            "button";

                        removeImported.title =
                            "Remove imported MP3";

                        removeImported.textContent =
                            "×";

                        removeImported.addEventListener(
                            "click",
                            function(event) {

                                event.stopPropagation();

                                removeImportedSong(
                                    index
                                );

                            }
                        );

                        actions.appendChild(
                            removeImported
                        );

                    }

                    const addPlaylist =
                        document.createElement("button");

                    addPlaylist.className =
                        "add-playlist-button";

                    addPlaylist.type = "button";
                    addPlaylist.title = "Add to playlist";
                    addPlaylist.textContent = "+";

                    addPlaylist.addEventListener(
                        "click",
                        function(event) {

                            event.stopPropagation();

                            openAddSongModal(index);

                        }
                    );

                    const favorite =
                        document.createElement("button");

                    favorite.className =
                        "favorite-button";

                    favorite.type = "button";

                    favorite.title =
                        isFavorite(index)
                            ? "Remove favorite"
                            : "Add favorite";

                    favorite.textContent =
                        isFavorite(index)
                            ? "★"
                            : "☆";

                    if (
                        isFavorite(index)
                    ) {

                        favorite.classList.add(
                            "favorite"
                        );

                    }

                    favorite.addEventListener(
                        "click",
                        function(event) {

                            event.stopPropagation();

                            const songName =
                                songs[index];

                            if (
                                favorites.includes(
                                    songName
                                )
                            ) {

                                favorites =
                                    favorites.filter(
                                        function(item) {
                                            return item !== songName;
                                        }
                                    );

                            } else {

                                favorites.push(
                                    songName
                                );

                            }

                            saveFavorites();

                            renderSongs();

                        }
                    );

                    actions.appendChild(addPlaylist);
                    actions.appendChild(favorite);

                    item.appendChild(number);
                    item.appendChild(name);
                    item.appendChild(actions);

                    item.addEventListener(
                        "click",
                        function() {

                            playlistPlayback = null;

                            loadSong(
                                index,
                                true
                            );

                        }
                    );

                    songList.appendChild(item);

                }
            );
        }

        /* =========================
           LOAD SONG
           ========================= */

        function loadSong(
            index,
            autoplay = false
        ) {

            if (!songs[index]) {
                return;
            }

            currentIndex = index;

            const song =
                songs[currentIndex];

            if (
                importedSongKeys.has(song) &&
                importedSongURLs[song]
            ) {

                audio.src =
                    importedSongURLs[song];

            } else {

                audio.src =
                    "music/" +
                    encodeURIComponent(song);

            }

            nowPlaying.textContent =
                getSongDisplayName(song);

            progress.value = 0;

            currentTime.textContent =
                "0:00";

            duration.textContent =
                "0:00";

            renderSongs();

            if (autoplay) {

                audio.play().catch(
                    function() {

                        playButton.textContent =
                            "▶";

                    }
                );

            } else {

                playButton.textContent =
                    "▶";

            }
        }

        /* =========================
           NEXT / PREVIOUS
           ========================= */

        function playNextSong() {

            if (
                playlistPlayback &&
                repeatMode !== 2
            ) {

                const played =
                    playNextPlaylistSong();

                if (played) {
                    return;
                }
            }

            if (songs.length === 0) {
                return;
            }

            let nextIndex;

            if (shuffleMode) {

                if (songs.length === 1) {

                    nextIndex = 0;

                } else {

                    do {

                        nextIndex =
                            Math.floor(
                                Math.random() *
                                songs.length
                            );

                    } while (
                        nextIndex ===
                        currentIndex
                    );
                }

            } else {

                nextIndex =
                    currentIndex + 1;

                if (
                    nextIndex >= songs.length ||
                    currentIndex === -1
                ) {

                    nextIndex = 0;
                }
            }

            loadSong(
                nextIndex,
                true
            );
        }

        function playPreviousSong() {

            if (playlistPlayback) {

                const playlistSongs =
                    getPlaylistSongs(
                        playlistPlayback.name
                    );

                if (
                    playlistSongs.length > 0
                ) {

                    if (
                        audio.currentTime > 3
                    ) {

                        audio.currentTime = 0;

                        return;
                    }

                    let previousIndex =
                        playlistPlayback.index - 1;

                    if (previousIndex < 0) {

                        previousIndex =
                            playlistSongs.length - 1;
                    }

                    playlistPlayback.index =
                        previousIndex;

                    const song =
                        playlistSongs[
                            previousIndex
                        ];

                    const actualIndex =
                        songs.indexOf(song);

                    if (
                        actualIndex !== -1
                    ) {

                        loadSong(
                            actualIndex,
                            true
                        );
                    }

                    return;
                }
            }

            if (songs.length === 0) {
                return;
            }

            if (
                audio.currentTime > 3
            ) {

                audio.currentTime = 0;

                return;
            }

            let previousIndex =
                currentIndex - 1;

            if (previousIndex < 0) {

                previousIndex =
                    songs.length - 1;
            }

            loadSong(
                previousIndex,
                true
            );
        }

        /* =========================
           PLAYER CONTROLS
           ========================= */

        playButton.addEventListener(
            "click",
            function() {

                if (currentIndex === -1) {

                    loadSong(
                        0,
                        true
                    );

                    return;
                }

                if (audio.paused) {

                    audio.play().catch(
                        function() {}
                    );

                } else {

                    audio.pause();

                }
            }
        );

        previousButton.addEventListener(
            "click",
            playPreviousSong
        );

        nextButton.addEventListener(
            "click",
            playNextSong
        );

        /* =========================
           SHUFFLE
           ========================= */

        shuffleButton.addEventListener(
            "click",
            function() {

                shuffleMode =
                    !shuffleMode;

                shuffleButton.classList.toggle(
                    "active",
                    shuffleMode
                );

                localStorage.setItem(
                    "jelloMusicShuffle",
                    shuffleMode
                );
            }
        );

        /* =========================
           REPEAT
           ========================= */

        repeatButton.addEventListener(
            "click",
            function() {

                repeatMode++;

                if (repeatMode > 2) {
                    repeatMode = 0;
                }

                updateRepeatButton();

                localStorage.setItem(
                    "jelloMusicRepeat",
                    repeatMode
                );
            }
        );

        function updateRepeatButton() {

            repeatButton.classList.remove(
                "active",
                "repeat-one"
            );

            if (repeatMode === 1) {

                repeatButton.classList.add(
                    "active"
                );

                repeatButton.title =
                    "Repeat All";

            } else if (repeatMode === 2) {

                repeatButton.classList.add(
                    "active",
                    "repeat-one"
                );

                repeatButton.title =
                    "Repeat One";

            } else {

                repeatButton.title =
                    "Repeat Off";
            }
        }

        /* =========================
           AUDIO EVENTS
           ========================= */

        audio.addEventListener(
            "play",
            function() {

                playButton.textContent =
                    "⏸";

            }
        );

        audio.addEventListener(
            "pause",
            function() {

                playButton.textContent =
                    "▶";

            }
        );

        audio.addEventListener(
            "ended",
            function() {

                if (repeatMode === 2) {

                    audio.currentTime = 0;

                    audio.play();

                    return;
                }

                if (playlistPlayback) {

                    const played =
                        playNextPlaylistSong();

                    if (played) {
                        return;
                    }
                }

                if (
                    repeatMode === 0 &&
                    !shuffleMode &&
                    currentIndex ===
                        songs.length - 1
                ) {

                    audio.currentTime = 0;

                    playButton.textContent =
                        "▶";

                    return;
                }

                playNextSong();

            }
        );

        audio.addEventListener(
            "loadedmetadata",
            function() {

                duration.textContent =
                    formatTime(
                        audio.duration
                    );

            }
        );

        audio.addEventListener(
            "timeupdate",
            function() {

                if (!audio.duration) {
                    return;
                }

                progress.value =
                    (
                        audio.currentTime /
                        audio.duration
                    ) * 100;

                currentTime.textContent =
                    formatTime(
                        audio.currentTime
                    );

            }
        );

        audio.addEventListener(
            "error",
            function() {

                nowPlaying.textContent =
                    "Unable to load this song";

                playButton.textContent =
                    "▶";

            }
        );

        audio.addEventListener(
            "play",
            function() {

                if (currentIndex !== -1) {

                    addRecent(
                        currentIndex
                    );
                }

                renderSongs();

            }
        );

        /* =========================
           PROGRESS
           ========================= */

        progress.addEventListener(
            "input",
            function() {

                if (!audio.duration) {
                    return;
                }

                audio.currentTime =
                    (
                        Number(progress.value) / 100
                    ) * audio.duration;

            }
        );

        /* =========================
           VOLUME
           ========================= */

        volume.addEventListener(
            "input",
            function() {

                audio.volume =
                    Number(this.value);

                localStorage.setItem(
                    "jelloMusicVolume",
                    this.value
                );

            }
        );

        /* =========================
           SEARCH
           ========================= */

        search.addEventListener(
            "input",
            function() {

                renderSongs();

            }
        );

        /* =========================
           FILTERS
           ========================= */

        allFilter.addEventListener(
            "click",
            function() {

                currentFilter = "all";

                updateFilterButtons();
                renderSongs();

            }
        );

        favoriteFilter.addEventListener(
            "click",
            function() {

                currentFilter = "favorites";

                updateFilterButtons();
                renderSongs();

            }
        );

        recentFilter.addEventListener(
            "click",
            function() {

                currentFilter = "recent";

                updateFilterButtons();
                renderSongs();

            }
        );

        function updateFilterButtons() {

            allFilter.classList.toggle(
                "active",
                currentFilter === "all"
            );

            favoriteFilter.classList.toggle(
                "active",
                currentFilter === "favorites"
            );

            recentFilter.classList.toggle(
                "active",
                currentFilter === "recent"
            );

        }

        /* =========================
           KEYBOARD CONTROLS
           ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.target.tagName === "INPUT" ||
                    event.target.tagName === "BUTTON"
                ) {

                    return;
                }

                if (event.code === "Space") {

                    event.preventDefault();

                    playButton.click();

                }

                if (
                    event.code === "ArrowRight"
                ) {

                    if (audio.duration) {

                        audio.currentTime =
                            Math.min(
                                audio.currentTime + 5,
                                audio.duration
                            );
                    }
                }

                if (
                    event.code === "ArrowLeft"
                ) {

                    if (audio.duration) {

                        audio.currentTime =
                            Math.max(
                                audio.currentTime - 5,
                                0
                            );
                    }
                }

            }
        );

        /* =========================
           RESTORE SETTINGS
           ========================= */

        const savedVolume =
            localStorage.getItem(
                "jelloMusicVolume"
            );

        if (savedVolume !== null) {

            volume.value =
                savedVolume;

            audio.volume =
                Number(savedVolume);

        } else {

            audio.volume = 1;

        }

        const savedShuffle =
            localStorage.getItem(
                "jelloMusicShuffle"
            );

        if (savedShuffle === "true") {

            shuffleMode = true;

            shuffleButton.classList.add(
                "active"
            );

        }

        const savedRepeat =
            localStorage.getItem(
                "jelloMusicRepeat"
            );

        if (savedRepeat !== null) {

            repeatMode =
                Number(savedRepeat);

        }

        updateRepeatButton();

        /* =========================
           QUICK SETTINGS
           ========================= */

        const quickSettings =
            document.getElementById(
                "quickSettings"
            );

        const quickNoTabClose =
            document.getElementById(
                "quickNoTabClose"
            );

        const quickFullscreen =
            document.getElementById(
                "quickFullscreen"
            );

        const quickMouseBackground =
            document.getElementById(
                "quickMouseBackground"
            );

        const background =
            document.getElementById(
                "background"
            );

        function enableNoTabClose() {

            window.onbeforeunload =
                function(event) {

                    event.preventDefault();

                    event.returnValue = "";

                    return "";

                };

        }

        function disableNoTabClose() {

            window.onbeforeunload = null;

        }

        if (
            localStorage.getItem(
                "noTabClose"
            ) === "true"
        ) {

            quickNoTabClose.checked =
                true;

            enableNoTabClose();

        }

        quickNoTabClose.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    localStorage.setItem(
                        "noTabClose",
                        "true"
                    );

                    enableNoTabClose();

                } else {

                    localStorage.setItem(
                        "noTabClose",
                        "false"
                    );

                    disableNoTabClose();

                }

            }
        );

        /* =========================
           FULL SCREEN
           ========================= */

        quickFullscreen.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    if (
                        document.documentElement
                            .requestFullscreen
                    ) {

                        document.documentElement
                            .requestFullscreen();

                    }

                } else {

                    if (
                        document.fullscreenElement
                    ) {

                        document.exitFullscreen();

                    }
                }
            }
        );

        document.addEventListener(
            "fullscreenchange",
            function() {

                quickFullscreen.checked =
                    !!document.fullscreenElement;

            }
        );

        /* =========================
           MOUSE BACKGROUND
           ========================= */

        let mouseBackgroundEnabled =
            localStorage.getItem(
                "mouseBackground"
            ) !== "false";

        quickMouseBackground.checked =
            mouseBackgroundEnabled;

        document.addEventListener(
            "mousemove",
            function(event) {

                if (!mouseBackgroundEnabled) {
                    return;
                }

                const x =
                    (
                        event.clientX /
                        window.innerWidth
                    ) - 0.5;

                const y =
                    (
                        event.clientY /
                        window.innerHeight
                    ) - 0.5;

                const moveX = x * 35;
                const moveY = y * 35;

                background.style.transform =
                    `translate(${moveX}px, ${moveY}px)`;

            }
        );

        quickMouseBackground.addEventListener(
            "change",
            function() {

                mouseBackgroundEnabled =
                    this.checked;

                localStorage.setItem(
                    "mouseBackground",
                    mouseBackgroundEnabled
                );

                if (!mouseBackgroundEnabled) {

                    background.style.transform =
                        "translate(0px, 0px)";

                }

            }
        );

        /* =========================
           OPEN SETTINGS WITH P
           ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.target.tagName === "INPUT" ||
                    event.target.tagName === "TEXTAREA" ||
                    event.target.tagName === "BUTTON"
                ) {

                    return;
                }

                if (
                    event.key.toLowerCase() === "p"
                ) {

                    quickSettings.classList.toggle(
                        "show"
                    );

                }

            }
        );

        /* =========================
           CLOSE SETTINGS
           ========================= */

        quickSettings.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    quickSettings
                ) {

                    quickSettings.classList.remove(
                        "show"
                    );

                }

            }
        );

        /* =========================
           START
           ========================= */

        renderPlaylists();

        renderPlaylistView();

        renderSongs();

        initializeImportedMP3s();

    </script>

</body>
</html>
